site_name: Psychometrics and R Shiny Notes
site_description: Psychometrics, CTT, IRT, local dependence, CAT, CDM, and R Shiny learning notes.
site_author: Jingyi Guo
site_url: https://place-bot.github.io/Psychometrics-and-R-Shiny/
repo_url: https://github.com/place-bot/Psychometrics-and-R-Shiny
repo_name: place-bot/Psychometrics-and-R-Shiny
strict: true

theme:
  name: material
  language: zh
  favicon: assets/images/favicon.png
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal

plugins:
  - search:
      lang: zh
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
          site_description: 心理测量、CTT、IRT、局部依赖、CAT、CDM 与 R Shiny 学习笔记。
        - locale: en
          name: English
          build: true
          site_name: Psychometrics and R Shiny Notes
          site_description: Learning notes on psychometrics, CTT, IRT, local dependence, CAT, CDM, and R Shiny.

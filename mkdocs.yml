site_name: Psychometrics and R Shiny Notes
site_description: Psychometrics, CTT, IRT, CAT, CDM, and R Shiny learning notes.
site_author: Jingyi Guo
site_url: https://place-bot.github.io/Psychometrics-and-R-Shiny/
repo_url: https://github.com/place-bot/Psychometrics-and-R-Shiny
repo_name: place-bot/Psychometrics-and-R-Shiny
strict: true

theme:
  name: material
  language: zh
  favicon: assets/images/favicon.png
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - fenced_code
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
      inline_syntax:
        - round
      block_syntax:
        - square
        - begin
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

